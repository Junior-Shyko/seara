version: '3.8'

services:
  # Serviço PHP-FPM
  php:
    image: seara:latest
    container_name: laravel-php
    working_dir: /var/www
    volumes:
      # - ./:/var/www
      - ./docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini
    networks:
      - laravel
    depends_on:
      mysql:
        condition: service_healthy
    command: >
       bash -c "
          composer install --no-interaction --optimize-autoloader &&
          php artisan config:cache &&
          php-fpm
        "
    healthcheck:
      test: ["CMD-SHELL", "pidof php-fpm"]
      interval: 30s
      timeout: 10s
      retries: 3
  # Serviço Nginx
  nginx:
    image: nginx:1.25
    container_name: laravel-nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      php:
        condition: service_healthy  # Aguarda o PHP estar saudável
    networks:
      - laravel
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Banco MySQL
  mysql:
    image: mysql:5.7
    container_name: laravel-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: seara
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    ports:
      - "4242:3306"
    volumes:
      - ./docker/mysql/data:/var/lib/mysql
    networks:
      - laravel
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Node.js para compilar assets
  node:
    image: node:6
    container_name: laravel-node
    working_dir: /var/www
    volumes:
      - ./:/var/www
    tty: true
    command: sh -c "npm install -g bower gulp@3 && bower install --allow-root && npm run dev"
    networks:
      - laravel

networks:
  laravel:

volumes:
  mysql_data:
