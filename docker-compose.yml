version: '2'
services:
  database:
    image: mariadb:10
    volumes:
      - database:/var/lib/mysql
    ports:
      - 4242:3306
    environment:
      - MYSQL_DATABASE=seara
      - MYSQL_ROOT_PASSWORD=root
  php:
    image: fcoedno/php:7.1-fpm-dev
    volumes:
      - ./:/code
      - composercache:/.composer
    working_dir: /code
    environment:
      - APP_ENV=dev
  web:
    image: fcoedno/nginx:1.13.8-dev
    volumes:
      - ./:/code:ro
    depends_on:
      - php
    ports:
      - 80:80
    environment:
      - NGINX_HOST=seara.localhost
      - NGINX_ROOT=/code/public
  node:
    build: docker/node/
    volumes:
      - ./:/code
    working_dir: /code
    command: tail -f /dev/null
volumes:
  database:
  composercache:

