version: '3.8'
services:
  database:
    image: mariadb:10
    container_name: database_prod
    volumes:
      - database:/var/lib/mysql
      - ./files:/opt/files
    ports:
      - 4242:3306
    environment:
      - MYSQL_DATABASE=seara
      - MYSQL_ROOT_PASSWORD=root

  php:
    build: docker/php
    container_name: php_prod
    volumes:
      - ./:/code
      - './docker/php/docker-php-composer.ini:/usr/local/etc/php/conf.d/docker-php-composer.ini'
    working_dir: /code

  web:
    image: nginx:alpine
    container_name: web_prod
    volumes:
      - ./:/code:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    ports:
      - 8000:80
    environment:
      - NGINX_HOST=seara.localhost

  node:
    container_name: node_prod
    build: docker/node/
    volumes:
      - ./:/code
    working_dir: /code
    command: tail -f /dev/null

volumes:
  database: