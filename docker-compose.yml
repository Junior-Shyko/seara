version: '3.8'

services:
  # Serviço PHP-FPM
  php:
    image: php:7.2-fpm
    container_name: laravel-php
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini
    networks:
      - laravel

    depends_on:
      - mysql
    build:
      context: .
      dockerfile: docker/php/Dockerfile

  # Serviço Nginx
  nginx:
    image: nginx:1.25
    container_name: laravel-nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - laravel

  # Banco MySQL
  mysql:
    image: mysql:5.7
    container_name: laravel-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: seara
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    ports:
      - "4242:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - laravel

  # Node.js para compilar assets
  node:
    image: node:6
    container_name: laravel-node
    working_dir: /var/www
    volumes:
      - ./:/var/www
    tty: true
    command: sh -c "npm install -g bower gulp@3 && bower install --allow-root && gulp watch"
    networks:
      - laravel

networks:
  laravel:

volumes:
  mysql_data:
