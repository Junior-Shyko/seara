name: Deploy

# Este workflow faz deploy apenas quando há push para master
# Você precisará configurar os secrets no GitHub:
# - DEPLOY_HOST: servidor de destino
# - DEPLOY_USER: usuário SSH
# - DEPLOY_KEY: chave SSH privada
# - DEPLOY_PATH: caminho no servidor

on:
  pull_request:
    branches:
      - develop
    types:
      - closed

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    # Descomente a linha abaixo após configurar o environment no GitHub
    # environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: mbstring, dom, fileinfo, mysql, gd, zip

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-dev --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '10'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Bower dependencies
        run: npx bower install

      - name: Build assets for production
        run: npm run dev

      - name: Deploy via Deployer
        run: |
          # Usando o deployer.php que já existe no projeto
          # Você precisará configurar os hosts em deploy.php
          vendor/bin/dep deploy production --revision="${GITHUB_SHA}"
        env:
          # Adicione as variáveis de ambiente necessárias aqui
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}

      # Deploy Docker via SSH
      - name: Deploy Docker via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            docker compose pull
            docker compose down
            docker compose up -d
            docker image prune -f

      - name: Slack Notification (opcional)
        if: always()
        run: |
          # Adicione notificação Slack/Discord/Email aqui se desejar
          echo "Deploy ${{ job.status }}"
