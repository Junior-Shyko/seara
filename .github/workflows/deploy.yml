name: Deploy

# Este workflow faz deploy quando um PR é fechado na branch develop
# Você precisará configurar os secrets no GitHub:
# - DOCKER_USERNAME: usuário do Docker Hub
# - DOCKER_PASSWORD: senha ou token do Docker Hub
# - DEPLOY_HOST: servidor de destino
# - DEPLOY_USER: usuário SSH
# - DEPLOY_KEY: chave SSH privada
# - DEPLOY_PATH: caminho no servidor

on:
  pull_request:
    branches:
      - develop
    types:
      - closed

jobs:
  deploy:
    name: Build and Deploy to Production
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: mbstring, dom, fileinfo, mysql, gd, zip

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-dev --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '10'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Bower dependencies
        run: npx bower install

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/php/Dockerfile
          push: true
          tags: junioroliveira/seara:latest
          cache-from: type=registry,ref=junioroliveira/seara:latest
          cache-to: type=inline
        timeout-minutes: 30

      - name: Push Docker image to Docker Hub
        run: |
          for i in 1 2 3; do
            docker push junioroliveira/seara:latest && break || sleep 15
          done

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          debug: true
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            docker pull junioroliveira/seara:latest
            docker compose -f docker-compose.production.yml down
            # Recria o volume do código — senão o /var/www continua servindo a imagem antiga
            docker volume ls -q | grep -E '_prod-app-root$' | xargs -r docker volume rm
            docker compose -f docker-compose.production.yml up -d
            sleep 15
            docker compose -f docker-compose.production.yml exec -T php php artisan migrate --force || true
            docker compose -f docker-compose.production.yml exec -T php php artisan view:clear || true
            docker compose -f docker-compose.production.yml exec -T php php artisan config:cache || true
            docker compose -f docker-compose.production.yml exec -T php php artisan route:cache || true
            docker image prune -f

      - name: Deployment notification
        if: always()
        run: |
          echo "Deployment status: ${{ job.status }}"
          echo "Image: junioroliveira/seara:latest"
