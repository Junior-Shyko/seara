version: '3.8'

services:
  # Banco MySQL
  mysql:
    image: mysql:5.7
    container_name: searaprodmysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-seara}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    networks:
      - scontab
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # Serviço PHP-FPM (usando imagem pré-construída)
  php:
    image: junioroliveira/seara:1.1.28
    container_name: searaprodphp
    working_dir: /var/www
    volumes:
      # Diretórios persistentes de dados
      - ./storage:/var/www/storage
      - ./bootstrap/cache:/var/www/bootstrap/cache
      - ./.env:/var/www/.env:ro
      - ./docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      # Volume compartilhado com Nginx (sem montar public separadamente)
      - app-root:/var/www
    networks:
      - scontab
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      bash -c "
        composer install &&
        php artisan config:cache &&
        php artisan route:cache &&
        php-fpm
      "
    healthcheck:
      test: ["CMD-SHELL", "pidof php-fpm"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # Serviço Nginx
  nginx:
    image: nginx:1.25
    container_name: searaprodnginx
    expose:
      - "80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Volume compartilhado com PHP para arquivos públicos e aplicação
      - app-root:/var/www:ro
    depends_on:
      php:
        condition: service_healthy
    networks:
      - scontab
      - nginx-proxy_default
    restart: unless-stopped
    environment:
      - VIRTUAL_HOST=${VIRTUAL_HOST:-app.searacontabilidade.com.br}
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=${LETSENCRYPT_HOST:-app.searacontabilidade.com.br}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL:-franciscoanto@gmail.com}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

networks:
  scontab:
    driver: bridge
  nginx-proxy_default:
    external: true

volumes:
  # Volume de dados do MySQL (separado)
  mysql-data:
    driver: local
  # Volume da aplicação (compartilhado entre PHP e Nginx)
  app-root:
    driver: local